services:
  # Backend API
  - type: web
    name: medtrack-backend
    runtime: node
    rootDir: backend-2.0
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: BREVO_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: NODE_ENV
        value: production

  # Frontend (Next.js)
  - type: web
    name: medtrack-frontend
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NODE_ENV
        value: production
